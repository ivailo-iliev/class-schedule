name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_full_e2e:
        description: Run the full local-Supabase and browser E2E suite
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:pwa

  full-e2e:
    name: full E2E (manual only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_e2e }}
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v3
      - run: npm ci
      - run: supabase start
      - name: Export the local database URL
        run: |
          raw_db_url="$(supabase status --output env | sed -n 's/^DB_URL=//p')"
          test -n "$raw_db_url"
          raw_db_url="${raw_db_url#\"}"
          raw_db_url="${raw_db_url%\"}"
          # Tests run on the host runner, so use the published local port.
          db_url="$(node --input-type=module -e 'const url = new URL(process.argv[1]); url.hostname = "127.0.0.1"; process.stdout.write(url.toString())' "$raw_db_url")"
          printf 'SUPABASE_DB_URL=%s\n' "$db_url" >> "$GITHUB_ENV"
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
