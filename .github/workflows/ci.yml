name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:orchestration
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:pwa

  integration:
    name: integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v3
      - run: npm ci
      - run: supabase start
      - name: Export the local database URL
        run: |
          raw_db_url="$(supabase status --output env | sed -n 's/^DB_URL=//p')"
          test -n "$raw_db_url"
          raw_db_url="${raw_db_url#\"}"
          raw_db_url="${raw_db_url%\"}"
          # The CLI may report a Docker-network hostname (for example, `base`).
          # Tests run on the host runner, so always connect through the published port.
          db_url="$(node --input-type=module -e 'const url = new URL(process.argv[1]); url.hostname = "127.0.0.1"; process.stdout.write(url.toString())' "$raw_db_url")"
          printf 'SUPABASE_DB_URL=%s\n' "$db_url" >> "$GITHUB_ENV"
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  report-main-ci-failure:
    name: report post-merge failure
    if: >-
      ${{ always() && github.event_name == 'push' &&
          (needs.quality.result == 'failure' || needs.integration.result == 'failure') }}
    needs: [quality, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = `Commit: \`${context.sha}\``;
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'hermes-repair',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'hermes-repair',
                color: 'B60205',
                description: 'Automated post-merge CI repairs for Hermes',
              });
            }
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'hermes-repair',
              per_page: 100,
            });
            if (existing.some((issue) => issue.body?.includes(marker))) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Hermes repair: CI failed for ${context.sha.slice(0, 12)}`,
              body: [
                'Automated post-merge CI failure.',
                '',
                marker,
                `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'The local Hermes delivery bridge will create an idempotent repair task.',
              ].join('\n'),
              labels: ['hermes-repair'],
            });
